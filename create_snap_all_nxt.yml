---

- name: Create VM Snapshots for machines
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
    - vm_list.yml
  vars:
    snapshot_name: >-
      Snapshot {{
        lookup(
          'pipe',
          'TZ=Africa/Cairo date "+%-m/%-d/%Y, %-I:%M:%S %p"'
        )
      }}
  tasks:
    - name: Take snapshot for VMs
      community.vmware.vmware_guest_snapshot:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        datacenter: "{{ datacenter_name }}"
        folder: "{{ item.folder }}"
        name: "{{ item.name }}"
        snapshot_name: "{{ snapshot_name }}"
        description: "Snapshot before software update"
        state: present
      loop: "{{ vm_list }}"

